name: Temporary HUMAN UI tests

on:
  push:
    branches:
      - ui/human-long-session-workspaces

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_ENGINE: sqlite
      SECRET_KEY: test-secret-key
      DEBUG: "0"
      ALLOWED_HOSTS: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Django checks
        run: python manage.py check
      - name: Relevant tests
        run: pytest rpg/tests/test_views.py rpg/tests/test_gm_engine.py
      - name: Install browser checker
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Responsive HUMAN smoke check
        run: |
          python manage.py migrate --noinput
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "mraz.settings")
          import django
          django.setup()

          from rpg.models import AuthorType, Message, PlayerTransport, TurnMode, Visibility
          from rpg.services import turn_engine
          from rpg.tests.factories import make_campaign, make_player, make_scene

          campaign = make_campaign(name="MRAZ Responsive Test")
          player = make_player(
              campaign,
              "Баальтаз",
              transport=PlayerTransport.HUMAN,
              character_summary="Long-session responsive smoke test.",
              characteristics="Страта: Инквизитор\nРанг: Парк",
              abilities="Адское зрение\nАмнезия",
              memory_summary="Помнит старый брифинг.",
          )
          scene = make_scene(
              campaign,
              name="Гданьск - Очень длинное название текущей сцены для проверки мобильного интерфейса",
              mode=TurnMode.MANUAL,
              participants=[player],
          )
          for index in range(120):
              Message.objects.create(
                  campaign=campaign,
                  scene=scene,
                  author_type=AuthorType.GM if index % 2 == 0 else AuthorType.PLAYER,
                  author_player=None if index % 2 == 0 else player,
                  visibility=Visibility.PUBLIC,
                  action_type="" if index % 2 == 0 else "ACT",
                  content=(
                      f"PUBLIC_{index:03d} "
                      + ("https://example.test/" + "x" * 260 if index == 119 else "Обычный текст сцены.")
                  ),
              )
          for index in range(20):
              Message.objects.create(
                  campaign=campaign,
                  scene=scene,
                  author_type=AuthorType.GM,
                  visibility=Visibility.PRIVATE_GM_PLAYER,
                  private_player=player,
                  content=f"PRIVATE_{index:03d}",
              )
          turn_engine.start_turn(
              scene=scene,
              gm_message_text="Текущий мастерский ход.",
              selected_players=[player],
          )
          token = scene.scene_participants.get(player=player).human_access_token
          with open("/tmp/human-token", "w", encoding="utf-8") as handle:
              handle.write(str(token))
          PY
          python manage.py runserver 127.0.0.1:8000 --noreload >/tmp/mraz-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 0.5
          done
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          token = open("/tmp/human-token", encoding="utf-8").read().strip()
          url = f"http://127.0.0.1:8000/play/{token}/"
          widths = [360, 390, 412, 430, 1280]

          with sync_playwright() as pw:
              browser = pw.chromium.launch()
              for width in widths:
                  height = 800 if width < 500 else 900
                  page = browser.new_page(viewport={"width": width, "height": height})
                  page.goto(url, wait_until="domcontentloaded")
                  page.wait_for_selector("#human-workspace-scene")

                  metrics = page.evaluate(
                      """() => ({
                        innerWidth: window.innerWidth,
                        innerHeight: window.innerHeight,
                        docWidth: document.documentElement.scrollWidth,
                        bodyHeight: document.body.getBoundingClientRect().height,
                        nav: document.querySelector('.human-workspace-nav').getBoundingClientRect(),
                        card: document.querySelector('#human-character-primary').getBoundingClientRect(),
                        host: document.querySelector('.human-workspace-host').getBoundingClientRect(),
                        sceneScroll: document.querySelector('#human-public-scroll').getBoundingClientRect()
                      })"""
                  )
                  assert metrics["docWidth"] <= metrics["innerWidth"] + 1, (width, metrics)
                  assert metrics["bodyHeight"] <= metrics["innerHeight"] + 1, (width, metrics)
                  assert metrics["nav"]["bottom"] <= metrics["innerHeight"] + 1, (width, metrics)
                  assert metrics["host"]["height"] >= 180, (width, metrics)
                  assert metrics["sceneScroll"]["width"] <= metrics["innerWidth"], (width, metrics)
                  assert metrics["card"]["height"] <= (125 if width < 500 else 150), (width, metrics)

                  page.click('[data-human-workspace-target="private"]')
                  assert page.locator("#human-workspace-private").evaluate(
                      "(el) => el.classList.contains('active')"
                  )
                  page.click('[data-human-workspace-target="character"]')
                  assert page.locator("#human-workspace-character").evaluate(
                      "(el) => el.classList.contains('active')"
                  )
                  page.click('[data-human-workspace-target="scene"]')

                  scroll = page.locator("#human-public-scroll")
                  scroll.evaluate("(el) => { el.scrollTop = 600; }")
                  before = scroll.evaluate("(el) => el.scrollTop")
                  page.click('[data-human-workspace-target="character"]')
                  page.click('[data-human-workspace-target="scene"]')
                  after = scroll.evaluate("(el) => el.scrollTop")
                  assert abs(after - before) <= 2, (width, before, after)
                  page.close()
              browser.close()
          PY
