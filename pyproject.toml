[project]
name = "mraz-master"
version = "0.1.0"
description = "MRAZ Master - tabletop/text RPG GM interface with multiple LLM players"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "whitenoise>=6.9,<7",
    "Pillow>=11.0,<12",
    "qrcode>=8.0,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mraz"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mraz.settings"
python_files = ["tests.py", "test_*.py"]
testpaths = ["rpg/tests"]
norecursedirs = ["scripts", ".venv", "staticfiles", "mraz", "mraz.egg-info"]
addopts = "--ignore=scripts"

[tool.ruff]
line-length = 100
target-version = "py313"