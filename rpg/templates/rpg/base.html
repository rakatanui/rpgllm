<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}MRAZ Master{% endblock %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
{% block favicon %}
<link rel="icon" type="image/svg+xml" href="/static/rpg/favicon-gm.svg">
{% endblock %}
<script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
<script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #58a6ff; --gm: #d2a8ff; --player: #79c0ff;
    --player-0: #79c0ff; --player-1: #7ee787; --player-2: #ffa657;
    --player-3: #ff7b72; --player-4: #56d4dd; --player-5: #e3b341;
    --private: #f0883e; --ok: #3fb950; --err: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { min-height:100%; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         font-size:14px; }
  body.scene-page { height:100vh; overflow:hidden; display:flex; flex-direction:column; }
  body.scene-page > header { flex:0 0 auto; }
  body.scene-page > .container { flex:1 1 auto; min-height:0; overflow:hidden; width:100%; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  header { background:var(--panel); border-bottom:1px solid var(--border);
           padding:10px 16px; display:flex; gap:16px; align-items:center; }
  header h1 { font-size:16px; margin:0; }
  header nav { display:flex; gap:12px; }
  .container { max-width:1800px; margin:0 auto; padding:16px; }
  .scene-shell { height:100%; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  .scene-controls { flex:0 0 auto; position:sticky; top:0; z-index:20;
                    background:var(--bg); padding-bottom:2px; }
  .gm-composer-sticky { position:sticky; top:0; z-index:30; background:var(--bg); }
  .btn { background:var(--panel); color:var(--text); border:1px solid var(--border);
         padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px; }
  .btn:hover { border-color:var(--accent); }
  .btn-primary { background:#238636; border-color:#238636; color:#fff; }
  .btn-primary:hover { background:#2ea043; }
  .btn:disabled { opacity:0.45; cursor:not-allowed; border-color:var(--border); }
  input[type=text], textarea, select {
    background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:6px 8px; font-family:inherit; font-size:13px; width:100%;
  }
  textarea { min-height:60px; resize:vertical; }
  .composer-toolbar { align-items:flex-end; }
  .gm-composer-input { flex:1 1 100%; min-height:150px; font-size:14px; line-height:1.45; }
  .round-setup { margin:0 0 10px; padding:10px 12px; border:1px solid var(--border);
                 border-radius:8px; background:var(--panel); }
  .round-setup-header { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; margin-bottom:8px; }
  .round-order-grid { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
  .round-order-row { display:flex; gap:6px; align-items:center; }
  .round-order-row select { min-width:140px; }
  .round-position { color:var(--muted); }
  .round-warning { margin-top:8px; color:var(--err); font-size:12px; }
  .grid3 { display:grid; grid-template-columns: 310px minmax(0, 1fr) minmax(440px, .9fr); gap:12px;
           flex:1 1 auto; min-height:0; height:auto; overflow:hidden; transition:grid-template-columns .16s ease; }
  .grid3.private-collapsed { grid-template-columns:310px minmax(0, 1fr) 58px; }
  .private-panel.collapsed { overflow:hidden; padding:8px; }
  .private-panel.collapsed .private-panel-body { display:none; }
  .private-panel.collapsed .private-panel-title-text { display:none; }
  .private-panel-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .private-panel-header h3 { margin:0; flex:1; }
  .private-panel-header .toolbar { margin:0; }
  .private-composer textarea { min-height:110px; width:100%; margin-bottom:8px; }
  .private-channel-messages { margin-bottom:10px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px;
           padding:12px; min-height:0; overflow:auto; }
  .panel h3 { margin-top:0; font-size:13px; color:var(--muted); text-transform:uppercase; }
  .msg { padding:6px 8px; border-radius:6px; margin-bottom:6px; border-left:3px solid var(--border); }
  .msg.gm { border-left-color:var(--gm); }
  .msg.player { border-left-color:var(--player); }
  .msg.private { border-left-color:var(--private); }
  .msg .author { font-weight:bold; }
  .msg-header { display:flex; align-items:center; gap:4px; margin-bottom:5px;
                min-height:18px; }
  .msg-actions { margin-left:auto; display:inline-flex; align-items:center; gap:4px; }
  .message-action-form { display:inline-flex; margin:0; }
  .msg-action-btn {
    padding:1px 6px;
    border:1px solid var(--border);
    border-radius:5px;
    background:transparent;
    color:var(--muted);
    font:inherit;
    font-size:10px;
    cursor:pointer;
  }
  .msg-action-btn:hover { color:var(--text); border-color:var(--accent); }
  .copy-message-btn {
    margin-left:auto;
    padding:1px 6px;
    border:1px solid var(--border);
    border-radius:5px;
    background:transparent;
    color:var(--muted);
    font:inherit;
    font-size:10px;
    cursor:pointer;
  }
  .copy-message-btn:hover { color:var(--text); border-color:var(--accent); }
  .copy-message-btn.copied { color:var(--ok); border-color:var(--ok); }
  .msg-menu { position:relative; display:inline-block; }
  .msg-menu > summary { list-style:none; cursor:pointer; color:var(--muted);
                        border:1px solid var(--border); border-radius:5px;
                        padding:0 7px; user-select:none; }
  .msg-menu > summary::-webkit-details-marker { display:none; }
  .msg-menu-popover { position:absolute; right:0; top:calc(100% + 4px); z-index:90;
                      min-width:190px; padding:6px; border:1px solid var(--border);
                      border-radius:7px; background:#1f2630;
                      box-shadow:0 10px 26px rgba(0,0,0,.4); }
  .msg-menu-popover form { margin:0; }
  .msg-menu-popover button, .msg-menu-popover a {
    display:block; width:100%; text-align:left; background:transparent; border:0;
    color:var(--text); padding:6px 8px; border-radius:5px; font:inherit; font-size:11px;
    cursor:pointer; text-decoration:none;
  }
  .msg-menu-popover button:hover, .msg-menu-popover a:hover { background:var(--bg); color:var(--accent); }
  .btn-small { padding:3px 7px; font-size:11px; }
  .retry-row { display:flex; gap:5px; flex-wrap:wrap; align-items:center; margin-top:6px; }
  .nudge-form { margin-top:6px; }
  .external-wait-card { margin-top:8px; padding:7px; border:1px solid rgba(240,136,62,.55);
                        border-radius:7px; background:rgba(240,136,62,.06); }
  .external-wait-card > summary { cursor:pointer; color:#ffc38f; font-size:12px; font-weight:bold; }
  .external-prompt { min-height:150px; margin:7px 0; font-size:11px; line-height:1.35; }
  .external-response-form textarea { min-height:120px; margin:4px 0 7px; font-size:12px; }
  .mraz-browser-bridge-button { display:none; }
  html[data-mraz-browser-bridge="ready"] .mraz-browser-bridge-button { display:inline-flex; }
  .mraz-browser-bridge-status { min-height:16px; margin-top:6px; }
  .mraz-browser-bridge-status[data-state="running"] { color:#ffc38f; }
  .mraz-browser-bridge-status[data-state="done"] { color:var(--ok); }
  .mraz-browser-bridge-status[data-state="error"] { color:var(--err); }
  .human-wait-card { margin-top:8px; padding:8px; border:1px solid rgba(63,185,80,.55);
                     border-radius:7px; background:rgba(63,185,80,.06); }
  .human-wait-card .toolbar { margin-top:6px; }
  .human-access-controls { margin-top:7px; padding:7px; border:1px solid var(--border);
                           border-radius:7px; background:rgba(255,255,255,.02); }
  .human-access-status { margin-bottom:5px; }
  .human-access-url { width:100%; margin:4px 0 6px; font-size:11px; font-family:monospace; }

  .gm-model-panel { margin-bottom:10px; overflow:visible; border-color:rgba(210,168,255,.35); }
  .gm-model-header { display:flex; justify-content:space-between; align-items:flex-start;
                     gap:12px; margin-bottom:8px; }
  .gm-model-header h3 { margin:2px 0 0; color:var(--gm); }
  .gm-model-header-actions { display:flex; gap:6px; align-items:center; flex-wrap:wrap;
                             justify-content:flex-end; }
  .gm-model-state-row { display:flex; align-items:center; gap:7px; flex-wrap:wrap;
                        margin:7px 0; }
  .gm-model-prompt { min-height:220px; margin:6px 0; font-size:11px; line-height:1.35; }
  .gm-model-import-form textarea { min-height:150px; margin:5px 0 7px; }
  .gm-model-draft-form { margin-top:8px; }
  .gm-model-draft-toolbar { display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap;
                            margin-bottom:8px; }
  .gm-model-draft-toolbar > label { min-width:260px; }
  .gm-model-targets { display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
  .gm-model-public-draft { min-height:170px; margin:5px 0 8px; font-size:14px; line-height:1.45; }
  .gm-model-private-drafts { border:1px solid var(--border); border-radius:7px; padding:8px;
                             margin:8px 0; background:rgba(210,168,255,.03); }
  .gm-model-private-drafts > summary { cursor:pointer; color:var(--gm); font-weight:bold;
                                       margin-bottom:6px; }
  .gm-model-private-drafts label { display:block; margin-top:7px; }
  .gm-model-private-drafts textarea { min-height:72px; margin-top:4px; }
  .gm-model-publish-toolbar { margin-top:8px; }
  .gm-model-debug { margin:8px 0; color:var(--muted); }
  .gm-model-debug pre { white-space:pre-wrap; overflow-wrap:anywhere; padding:8px;
                        border:1px solid var(--border); border-radius:6px;
                        background:var(--bg); color:var(--text); font-size:11px; }
  .gm-model-start-form { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

  body.human-player-page .container { max-width:1100px; padding:10px; }
  .human-player-shell { width:100%; }
  .human-character-card { display:grid; grid-template-columns:180px minmax(0,1fr); gap:16px;
                          margin-bottom:10px; overflow:visible; }
  .human-character-primary-card { align-items:start; }
  .human-character-reference { margin-top:10px; }
  .human-character-reference-header { display:flex; justify-content:space-between; gap:10px;
                                      align-items:flex-start; margin-bottom:8px; }
  .human-character-reference-header h3 { margin:2px 0 0; }
  .human-episode-quick-search-top { margin-top:0; margin-bottom:10px; }
  .human-legacy-portrait-tools { margin-top:10px; border:1px solid var(--border); border-radius:7px;
                                 padding:8px; background:rgba(255,255,255,.02); }
  .human-legacy-portrait-tools > summary { cursor:pointer; color:var(--muted); font-size:12px;
                                           font-weight:bold; text-transform:uppercase; }
  .human-character-portrait-column { min-width:0; }
  .human-character-portrait { width:100%; aspect-ratio:1 / 1; border:1px solid var(--border);
                              border-radius:10px; overflow:hidden; background:var(--bg);
                              display:flex; align-items:center; justify-content:center; }
  .human-character-portrait img { width:100%; height:100%; object-fit:cover; display:block; }
  .human-character-portrait-placeholder { font-size:72px; font-weight:bold; color:var(--muted); }
  .human-character-image-form { display:grid; gap:6px; margin-top:8px; }
  .human-character-image-form input[type=file] { max-width:100%; font-size:11px; color:var(--muted); }
  .human-character-image-remove { margin-top:6px; }
  .human-appearance-switcher { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .human-appearance-tab { display:inline-flex; align-items:center; gap:4px; padding:4px 7px;
                          border:1px solid var(--border); border-radius:6px; color:var(--muted);
                          font-size:11px; text-decoration:none; background:var(--bg); }
  .human-appearance-tab:hover { border-color:var(--accent); color:var(--text); text-decoration:none; }
  .human-appearance-tab.selected { border-color:var(--accent); color:var(--text); }
  .human-appearance-current-dot { color:var(--ok); font-size:9px; }
  .human-character-body { min-width:0; }
  .human-character-heading { display:flex; justify-content:space-between; gap:10px;
                             align-items:flex-start; margin-bottom:8px; }
  .human-character-heading h2 { margin:2px 0 0; font-size:22px; }
  .human-appearance-title { display:flex; align-items:center; gap:7px; flex-wrap:wrap;
                            margin-top:5px; font-weight:bold; }
  .human-current-appearance-chip { color:var(--ok); border-color:rgba(63,185,80,.55); }
  .human-appearance-description { white-space:pre-wrap; line-height:1.5; margin:8px 0 10px;
                                  padding:8px 10px; border-left:3px solid var(--accent);
                                  background:rgba(88,166,255,.05); }
  .human-set-current-appearance { margin:0 0 10px; }
  .human-set-current-appearance-primary { margin-top:8px; margin-bottom:0; }
  .human-fullbody-reference { margin:0 0 10px; border:1px solid var(--border); border-radius:7px;
                              padding:8px; background:rgba(255,255,255,.02); }
  .human-fullbody-reference > summary { cursor:pointer; color:var(--muted); font-size:12px;
                                        font-weight:bold; text-transform:uppercase; }
  .human-fullbody-reference a { display:block; margin-top:8px; text-align:center; }
  .human-fullbody-reference img { display:block; width:auto; max-width:100%; max-height:78vh;
                                  margin:0 auto; object-fit:contain; border-radius:7px;
                                  background:var(--bg); }
  .human-character-summary { white-space:pre-wrap; line-height:1.5; margin-bottom:10px; }
  .human-character-sections { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
  .human-character-sections details { border:1px solid var(--border); border-radius:7px;
                                      padding:8px; background:rgba(255,255,255,.02); }
  .human-character-sections summary { cursor:pointer; color:var(--muted); font-size:12px;
                                      font-weight:bold; text-transform:uppercase; }
  .human-character-sections .msg-content { margin-top:7px; }
  .human-episode-quick-search { display:grid; grid-template-columns:minmax(0,1fr) auto;
                               gap:8px; margin-top:10px; }
  .human-history-shell { width:100%; }
  .human-history-header { display:flex; align-items:flex-start; justify-content:space-between;
                          gap:12px; margin-bottom:10px; }
  .human-history-header h2 { margin:3px 0; }
  .human-history-search-form { display:grid; grid-template-columns:minmax(0,1fr) auto auto;
                               gap:8px; margin-bottom:10px; }
  .human-episode-results { overflow:visible; }
  .human-episode-result { padding:10px 0; border-bottom:1px solid var(--border); }
  .human-episode-result:last-child { border-bottom:0; }
  .human-episode-result-title { display:flex; gap:8px; align-items:center; font-weight:bold; margin-bottom:5px; }
  .human-episode-description { white-space:pre-wrap; line-height:1.45; margin:5px 0; color:var(--text); }
  .human-episode-summary { white-space:pre-wrap; line-height:1.45; margin:7px 0;
                           padding:7px 9px; border-left:3px solid var(--accent);
                           background:rgba(88,166,255,.05); }
  .human-episode-memory { margin-bottom:10px; }
  .human-history-feed { max-height:none; }
  .human-status-card { display:flex; justify-content:space-between; gap:12px; align-items:center;
                       margin-bottom:10px; padding:12px 14px; background:var(--panel);
                       border:1px solid var(--border); border-radius:10px; }
  .human-status-card h2 { margin:3px 0 0; font-size:20px; }
  .human-status-copy { display:flex; gap:7px; flex-wrap:wrap; align-items:center; justify-content:flex-end; }
  .human-turn-card { margin-bottom:10px; border-color:rgba(63,185,80,.45); }
  .human-action-toolbar { display:flex; gap:10px; margin-bottom:8px; }
  .human-action-toolbar label { min-width:190px; }
  .human-action-form > textarea { min-height:150px; font-size:15px; line-height:1.5; }
  .human-private-note { margin:8px 0; color:var(--muted); }
  .human-private-note textarea { margin-top:7px; }
  .human-submit { width:100%; padding:10px 14px; font-size:15px; }
  .human-feed-grid { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(300px,.8fr); gap:10px; }
  .human-feed { max-height:56vh; overflow:auto; }
  .human-ooc-form { margin-top:12px; padding-top:10px; border-top:1px solid var(--border); }
  .human-ooc-form textarea { min-height:90px; margin:5px 0 7px; }
  @media (max-width: 760px) {
    body.human-player-page .container { padding:8px; }
    body.human-player-page header { padding:8px 10px; }
    .human-status-card { align-items:flex-start; flex-direction:column; }
    .human-character-card { grid-template-columns:112px minmax(0,1fr); gap:10px; padding:10px; }
    .human-character-portrait-column { max-width:112px; width:100%; margin:0; }
    .human-character-portrait-placeholder { font-size:42px; }
    .human-character-heading { margin-bottom:4px; }
    .human-character-heading h2 { font-size:19px; }
    .human-appearance-title { margin-top:3px; font-size:13px; }
    .human-appearance-switcher { margin-top:6px; }
    .human-appearance-tab { padding:3px 6px; font-size:10px; }
    .human-character-sections { grid-template-columns:1fr; }
    .human-character-reference-header { flex-direction:column; }
    .human-episode-quick-search { grid-template-columns:1fr; }
    .human-history-header { flex-direction:column; }
    .human-history-search-form { grid-template-columns:1fr; }
    .human-status-copy { justify-content:flex-start; }
    .human-feed-grid { grid-template-columns:1fr; }
    .human-feed { max-height:none; }
    .human-action-form > textarea { min-height:180px; }
    .human-status-card h2 { font-size:18px; }
  }
  .public-filter { display:grid; grid-template-columns:minmax(120px,1fr) 140px 150px;
                   gap:6px; margin-bottom:8px; }
  .close-review { border:1px solid var(--private); border-radius:8px; padding:10px;
                  margin-bottom:10px; background:rgba(240,136,62,.06); }
  .close-review textarea { min-height:95px; margin-bottom:8px; }
  .ooc-composer-mode { border-color:var(--private)!important; color:#ffc38f!important; }
  .ooc-only[hidden], .ic-only[hidden] { display:none!important; }
  .msg-content { white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.5; }

  .translated-speech {
    position:relative;
    display:inline;
    border-bottom:1px dotted rgba(230,237,243,0.45);
    cursor:help;
    white-space:pre-wrap;
  }
  .translated-speech::after {
    content:attr(data-translation);
    position:absolute;
    left:0;
    top:calc(100% + 7px);
    z-index:80;
    width:max-content;
    max-width:min(420px, 75vw);
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:7px;
    background:#1f2630;
    color:var(--text);
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
    font-size:12px;
    line-height:1.4;
    white-space:pre-wrap;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transform:translateY(-2px);
    transition:opacity .12s ease, transform .12s ease, visibility .12s ease;
  }
  .translated-speech:hover::after,
  .translated-speech:focus::after {
    opacity:1;
    visibility:visible;
    transform:translateY(0);
  }
  .translated-speech:focus { outline:1px solid var(--accent); outline-offset:2px; }

  .msg.gm .author { color:var(--gm); }
  .msg.player .author { color:var(--player); }
  .msg.private .author { color:var(--private); }

  .msg.speaker-player-0 { border-left-color:var(--player-0); }
  .msg.speaker-player-1 { border-left-color:var(--player-1); }
  .msg.speaker-player-2 { border-left-color:var(--player-2); }
  .msg.speaker-player-3 { border-left-color:var(--player-3); }
  .msg.speaker-player-4 { border-left-color:var(--player-4); }
  .msg.speaker-player-5 { border-left-color:var(--player-5); }
  .msg.speaker-player-0 .author { color:var(--player-0); }
  .msg.speaker-player-1 .author { color:var(--player-1); }
  .msg.speaker-player-2 .author { color:var(--player-2); }
  .msg.speaker-player-3 .author { color:var(--player-3); }
  .msg.speaker-player-4 .author { color:var(--player-4); }
  .msg.speaker-player-5 .author { color:var(--player-5); }

  .round-block { padding:8px; margin-bottom:10px; border-radius:8px;
                 border:1px solid rgba(255,255,255,0.045); }
  .round-block-base { background:rgba(88,166,255,0.035); }
  .round-block-alt { background:rgba(210,168,255,0.035); }
  .round-block .msg:last-child { margin-bottom:0; }

  .action-tag { display:inline-block; margin:0 6px 0 4px; padding:0 5px;
                border-radius:4px; font-size:11px; font-weight:bold;
                border:1px solid var(--border); }
  .action-act { color:var(--ok); border-color:rgba(63,185,80,0.45); }
  .action-pass { color:var(--muted); border-color:rgba(139,148,158,0.35); }
  .action-act_out_of_turn { color:var(--private); border-color:rgba(240,136,62,0.45); }

  .saoot-target { width:auto; min-width:180px; max-width:320px; }
  .btn-saoot { border-color:rgba(240,136,62,0.65); color:#ffc38f; }
  .btn-saoot:hover { border-color:var(--private); }
  .saoot-resolution { display:block; margin:5px 0; padding:6px 8px;
                      border:1px solid rgba(240,136,62,0.4);
                      border-left:3px solid var(--private);
                      border-radius:6px; background:rgba(240,136,62,0.08); }
  .saoot-label { display:block; margin-bottom:4px; color:var(--private);
                 font-size:11px; font-weight:bold; }
  .saoot-body { display:block; white-space:pre-wrap; }

  .execution-error { color:var(--err); font-size:11px; line-height:1.35; margin-top:5px; }
  .retry-execution-form { margin-top:6px; }
  .btn-retry { border-color:rgba(248,81,73,0.65); color:#ffb3ad; }
  .btn-retry:hover { border-color:var(--err); }

  .msg:target { outline:1px solid var(--accent); background:#1b2530; }
  .private-ref { margin-top:6px; padding-top:5px; border-top:1px dashed var(--border);
                 color:var(--muted); font-size:11px; line-height:1.35; }
  .private-ref a { color:var(--muted); text-decoration:underline dotted; }
  .private-ref a:hover { color:var(--accent); }
  .chip { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px;
          background:var(--bg); border:1px solid var(--border); color:var(--muted); }
  .chip.idle { color:var(--muted); }
  .chip.generating { color:var(--accent); border-color:var(--accent); }
  .chip.waiting_external { color:var(--private); border-color:var(--private); }
  .chip.waiting_human { color:var(--ok); border-color:var(--ok); }
  .chip.error { color:var(--err); border-color:var(--err); }
  .player-row { padding:6px 8px; border-radius:6px; margin-bottom:6px; background:var(--bg); }
  .player-row.active { outline:2px solid var(--accent); }
  .private-unread-dot { color:var(--private); font-size:12px; line-height:1; margin-left:4px; }
  .private-tab-form { display:inline-flex; margin:0; }
  .meta { color:var(--muted); font-size:11px; }
  form.inline { display:inline; }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  label { color:var(--muted); font-size:12px; }
  .pass { color:var(--muted); font-style:italic; }
  .turn-banner { background:#1f2937; padding:4px 8px; border-radius:6px; margin-bottom:6px; font-size:12px; }
</style>
</head>
<body class="{% block body_class %}{% endblock %}">
<header>
  <h1>MRAZ Master</h1>
  {% block nav %}
  <nav>
    <a href="/">Home</a>
    <a href="/admin/">Admin</a>
  </nav>
  {% endblock %}
  <div style="margin-left:auto" class="meta">{% block meta %}{% endblock %}</div>
</header>
<div class="container">
{% block content %}{% endblock %}
</div>
<script>
function prepareOocRevision(form) {
  const comment = window.prompt(
    "OOC-комментарий к заявке. Игрок получит его приватно и сможет изменить заявку:"
  );
  if (comment === null) return false;
  if (!comment.trim()) {
    window.alert("OOC-комментарий не может быть пустым.");
    return false;
  }
  form.querySelector('input[name="comment"]').value = comment.trim();
  return true;
}

function preparePlayerNudge(form, playerName) {
  const current = form.closest(".player-row")?.querySelector(".chip[title]")?.title || "";
  const value = window.prompt(
    "Одноразовая инструкция для " + playerName + " на следующий вызов. Пустое значение очистит Nudge:",
    current
  );
  if (value === null) return false;
  form.querySelector('input[name="content"]').value = value.trim();
  return true;
}

function prepareMemoryPin(form, target) {
  const message = form.closest(".msg");
  const visible = message?.querySelector(".msg-content")?.innerText.trim() || "";
  const author = message?.querySelector(".author")?.innerText.trim() || "";
  const proposed = visible ? (author ? author + ": " + visible : visible) : author;
  const value = window.prompt("Текст для " + target + ":", proposed);
  if (value === null || !value.trim()) return false;
  form.querySelector('input[name="content"]').value = value.trim();
  return true;
}

function filterPublicMessages() {
  const q = (document.getElementById("public-filter-text")?.value || "").toLowerCase();
  const author = document.getElementById("public-filter-author")?.value || "";
  const action = document.getElementById("public-filter-action")?.value || "";

  document.querySelectorAll("#public-scene .msg").forEach((msg) => {
    const text = msg.innerText.toLowerCase();
    const ok =
      (!q || text.includes(q)) &&
      (!author || msg.dataset.author === author) &&
      (!action || msg.dataset.action === action);
    msg.hidden = !ok;
  });
  document.querySelectorAll("#public-scene .round-block").forEach((block) => {
    block.hidden = !Array.from(block.querySelectorAll(".msg")).some((msg) => !msg.hidden);
  });
}

function togglePrivatePanel(forceOpen = null) {
  const grid = document.getElementById("scene-grid");
  const panel = document.getElementById("private-panel");
  if (!grid || !panel) return;
  const currentlyCollapsed = panel.classList.contains("collapsed");
  const shouldCollapse = forceOpen === true ? false : forceOpen === false ? true : !currentlyCollapsed;
  panel.classList.toggle("collapsed", shouldCollapse);
  grid.classList.toggle("private-collapsed", shouldCollapse);
  localStorage.setItem("mraz.private.collapsed", shouldCollapse ? "1" : "0");
  const button = document.getElementById("private-toggle");
  if (button) button.textContent = shouldCollapse ? "▶" : "◀";
}

let knownUnreadPlayers = new Set();

function privateAutoOpenEnabled() {
  return localStorage.getItem("mraz.private.autoopen") !== "0";
}

function setPrivateAutoOpen(checkbox) {
  localStorage.setItem("mraz.private.autoopen", checkbox.checked ? "1" : "0");
}

function maybeAutoOpenPrivate({ initial = false } = {}) {
  const current = new Set(
    Array.from(document.querySelectorAll("#players [data-unread-player]"))
      .map((node) => Number(node.dataset.unreadPlayer))
      .filter((value) => Number.isFinite(value))
  );

  let playerId = null;
  if (initial && current.size) {
    playerId = Array.from(current)[0];
  } else {
    playerId = Array.from(current).find((id) => !knownUnreadPlayers.has(id)) ?? null;
  }
  knownUnreadPlayers = current;

  if (playerId === null || !privateAutoOpenEnabled()) return;
  togglePrivatePanel(true);
  window.dispatchEvent(new CustomEvent("open-private", { detail: { playerId } }));
}

function hydrateHumanAccessUrls(root = document) {
  const scope = root && typeof root.querySelectorAll === "function" ? root : document;
  scope.querySelectorAll(".human-access-url").forEach((input) => {
    const raw = input.dataset.relativeUrl || input.value;
    if (!raw) return;
    try {
      input.value = new URL(raw, window.location.href).href;
    } catch (error) {
      console.warn("Failed to build absolute human player URL", error);
    }
  });
}

hydrateHumanAccessUrls();
document.body.addEventListener("htmx:afterSwap", (event) => {
  hydrateHumanAccessUrls(event.detail?.target || document);
});

async function copyElementText(elementId, button) {
  const element = document.getElementById(elementId);
  if (!element) return;
  const text = "value" in element ? element.value : element.innerText;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const helper = document.createElement("textarea");
      helper.value = text;
      helper.setAttribute("readonly", "");
      helper.style.position = "fixed";
      helper.style.opacity = "0";
      document.body.appendChild(helper);
      helper.select();
      const copied = document.execCommand("copy");
      helper.remove();
      if (!copied) throw new Error("copy command failed");
    }
    if (button) {
      const previous = button.textContent;
      button.textContent = "✓ copied";
      window.setTimeout(() => { button.textContent = previous; }, 900);
    }
  } catch (error) {
    console.warn("Failed to copy text", error);
    if (button) {
      const previous = button.textContent;
      button.textContent = "!";
      window.setTimeout(() => { button.textContent = previous; }, 900);
    }
  }
}

async function copyMessage(button) {
  const message = button.closest(".msg");
  if (!message) return;

  const author = message.querySelector(".author")?.innerText.trim() || "";
  const action = message.querySelector(".action-tag")?.innerText.trim() || "";
  const content = message.querySelector(".msg-content")?.innerText.trim() || "";
  const header = [author, action].filter(Boolean).join(" ");
  const text = content ? header + "\n" + content : header;

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const helper = document.createElement("textarea");
      helper.value = text;
      helper.setAttribute("readonly", "");
      helper.style.position = "fixed";
      helper.style.opacity = "0";
      document.body.appendChild(helper);
      helper.select();
      const copied = document.execCommand("copy");
      helper.remove();
      if (!copied) throw new Error("copy command failed");
    }

    const previous = button.textContent;
    button.textContent = "✓";
    button.classList.add("copied");
    window.setTimeout(() => {
      button.textContent = previous;
      button.classList.remove("copied");
    }, 900);
  } catch (error) {
    console.warn("Failed to copy message", error);
    button.textContent = "!";
    window.setTimeout(() => { button.textContent = "Copy"; }, 900);
  }
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
