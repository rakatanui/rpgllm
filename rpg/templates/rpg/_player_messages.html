{% for m in messages %}
  <div class="msg {% if m.author_type == "GM" %}gm{% else %}private{% endif %}">
    <span class="author">{% if m.author_type == "GM" %}GM{% elif m.author_player %}{{ m.author_player.display_name }}{% else %}System{% endif %}</span>:
    {{ m.content }}
  </div>
{% empty %}
  <p class="meta">No messages.</p>
{% endfor %}
