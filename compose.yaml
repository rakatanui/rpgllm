name: mraz-master

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mraz}
      POSTGRES_USER: ${POSTGRES_USER:-mraz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_pg_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mraz} -d ${POSTGRES_DB:-mraz}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port published

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    environment:
      # Provider keys (optional, passed through from .env)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-default}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:4000/health/liveliness',timeout=5); sys.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No host port published

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-default}
    depends_on:
      db:
        condition: service_healthy
      litellm:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    ports:
      - "127.0.0.100:80:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 10

  web-test:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "1"
    profiles: ["test"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-default}
    depends_on:
      db:
        condition: service_healthy
      litellm:
        condition: service_healthy
    # No ports; used only for `docker compose run --rm web-test pytest`

  player-edge:
    image: nginx:alpine
    profiles: ["public-player"]
    restart: unless-stopped
    environment:
      PUBLIC_PLAYER_HOST: ${PUBLIC_PLAYER_HOST:-}
      # Only substitute our deployment variable; leave nginx variables intact.
      NGINX_ENVSUBST_FILTER: ^PUBLIC_PLAYER_HOST
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./deploy/player-edge.nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Deliberately no host port. Only cloudflared can reach this service
    # through the private Compose network.

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["public-player"]
    restart: unless-stopped
    environment:
      # Official cloudflared environment equivalent of --token.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: ["tunnel", "--no-autoupdate", "run"]
    depends_on:
      player-edge:
        condition: service_healthy
    # Deliberately no host port. Cloudflare Tunnel is outbound-only.

volumes:
  pgdata:
  media_data:
